name: VLC Plus Android debug APK
on:
  push:
    branches: [bluevlc/bootstrap, vlcplus/in-app-updater, vlcplus/direct-cast-subtitles, vlcplus/cast-controls-v7, vlcplus/cast-performance-v8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Mirrors VideoLAN's Android-3.0 app build environment and init command.
    container:
      image: registry.videolan.org/vlc-debian-android-3.0:20260701183656
      # VideoLAN's image defaults to an unprivileged user, which cannot write
      # GitHub Actions' mounted _runner_file_commands directory during checkout.
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Trust GitHub checkout for Gradle git revision detection
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # VLC's native source preparation applies patch commits. Git needs an
          # identity for those temporary CI-only commits (not a developer identity).
          git config --global user.name "VLC Plus CI"
          git config --global user.email "bluevlc-ci@users.noreply.github.com"
          git -C application/vlc-android rev-parse --short HEAD
      - name: Initialize upstream Android toolchain and VLC dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SDK:-}" || { echo "::error::ANDROID_SDK missing in build image"; exit 1; }
          test -n "${ANDROID_NDK:-}" || { echo "::error::ANDROID_NDK missing in build image"; exit 1; }
          ./buildsystem/compile.sh --init
      - name: Compile debug APK
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == "vlcplus/cast-performance-v8" ]]; then
            ./gradlew :application:cast-tests:assembleDebug :application:cast-tests:assembleDebugAndroidTest -PcastCodecTests=true --no-daemon --stacktrace
          else
            ./gradlew :application:app:assembleDebug :application:cast-tests:assembleDebug :application:cast-tests:assembleDebugAndroidTest -PcastCodecTests=true --no-daemon --stacktrace
          fi
      - name: Upload VLC Plus APK
        if: github.ref_name != 'vlcplus/cast-performance-v8'
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Plus-debug-apk
          path: application/app/build/outputs/apk/debug/VLC-Plus-*.apk
          if-no-files-found: error
      - name: Upload isolated codec fixture APKs
        uses: actions/upload-artifact@v4
        with:
          name: Direct-Cast-codec-test-apks
          path: application/cast-tests/build/outputs/apk/**/*.apk
          if-no-files-found: error

  codec-fixtures:
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Direct-Cast-codec-test-apks
          path: codec-apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify preparation on Android codecs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          profile: pixel_6
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r codec-apks/debug/cast-tests-debug.apk
            adb install -r codec-apks/androidTest/debug/cast-tests-debug-androidTest.apk
            adb shell wm size 1280x2772
            adb shell wm density 520
            adb shell am instrument -w -r com.strokedot.vlcplus.codectests.test/androidx.test.runner.AndroidJUnitRunner | tee codec-result.txt
            adb logcat -d -s VLCPlus/CastPerf:I > cast-performance.txt
            cat cast-performance.txt
            adb logcat -d > cast-device-log.txt
            adb pull /sdcard/Android/data/com.strokedot.vlcplus.codectests/files/. cast-diagnostics
            grep -q 'OK (17 tests)' codec-result.txt

      - name: Save Android 16 controller screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Plus-cast-controls-Android16
          path: |
            cast-diagnostics/
            cast-performance.txt
            cast-device-log.txt
            codec-result.txt
          if-no-files-found: warn
          retention-days: 30
