name: BlueVLC Android debug APK
on:
  push:
    branches: [bluevlc/bootstrap]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Mirrors VideoLAN's Android-3.0 app build environment and init command.
    container:
      image: registry.videolan.org/vlc-debian-android-3.0:20260701183656
      # VideoLAN's image defaults to an unprivileged user, which cannot write
      # GitHub Actions' mounted _runner_file_commands directory during checkout.
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Initialize upstream Android toolchain and VLC dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_SDK:-}" || { echo "::error::ANDROID_SDK missing in build image"; exit 1; }
          test -n "${ANDROID_NDK:-}" || { echo "::error::ANDROID_NDK missing in build image"; exit 1; }
          ./buildsystem/compile.sh --init
      - name: Compile debug APK
        shell: bash
        run: ./gradlew :application:app:assembleDebug --no-daemon --stacktrace
      - name: Upload BlueVLC APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueVLC-debug-apk
          path: application/app/build/outputs/apk/debug/BlueVLC-*.apk
          if-no-files-found: error
